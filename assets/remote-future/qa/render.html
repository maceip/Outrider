<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;background:#0a0c0b;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
window.__basicCtor = THREE.MeshBasicMaterial;

const q = new URLSearchParams(location.search);
const modelUrl = q.get('model');
const view = q.get('view') || 'front';
const envI = parseFloat(q.get('env') || '0.65');
const exp = parseFloat(q.get('exposure') || '0.90');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(2);
renderer.setSize(900, 1200);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = exp;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0c0b);

const pmrem = new THREE.PMREMGenerator(renderer);
if (q.get('env') !== 'none') scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = envI;

const key = new THREE.PointLight(0xffffff, 3.0, 0, 2); key.position.set(-1.3, 1.7, 2.4); scene.add(key);
const fill = new THREE.DirectionalLight(0xbfe9ff, 0.30); fill.position.set(2.2, 0.4, 1.5); scene.add(fill);
const rim = new THREE.DirectionalLight(0x7cffb2, 0.45); rim.position.set(0.4, -1.2, -2.4); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.05));

const camera = new THREE.PerspectiveCamera(28, 900 / 1200, 0.05, 100);
const VIEWS = {
  front:      [0, 0, 2.55],
  quarter:    [1.45, 0.35, 2.25],
  low:        [0.85, -0.75, 2.40],
  back:       [0, 0, -2.55],
  side:       [2.55, 0, 0.05],
};
const target = new THREE.Vector3(0, 0, 0);
if (view === 'quarter') target.set(0, 0.02, 0);
camera.position.set(...(VIEWS[view] || VIEWS.front));
camera.lookAt(target);

new GLTFLoader().load(modelUrl, (gltf) => {
  const model = gltf.scene;
  model.traverse((o) => {
    if (o.isMesh) {
      o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of mats) { if (m) { m.side = THREE.FrontSide; m.needsUpdate = true; } }
    }
  });
  scene.add(model);
  window.__scene = scene; window.__renderer = renderer; window.__camera = camera;
  renderer.render(scene, camera);
  requestAnimationFrame(() => {
    renderer.render(scene, camera);
    window.__ready = true;
  });
}, undefined, (err) => { console.error('load error', err); window.__error = String(err); });
</script>
</body>
</html>
