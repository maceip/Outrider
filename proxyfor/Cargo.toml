[package]
name = "proxyfor"
version = "0.5.7"
default-run = "outrider"
edition = "2024"
rust-version = "1.88"
authors = ["sigoden <sigoden@gmail.com>"]
description = "Outrider: inspecting HTTP(S)/WS proxy and MCP dynamic commerce gateway with native CLEF execution"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/sigoden/proxyfor"
repository = "https://github.com/sigoden/proxyfor"
categories = ["command-line-utilities"]
keywords = ["proxy", "cli", "http", "websocket", "tui"]

[dependencies]
reqwest = { version = "0.12.2", features = ["rustls-tls-webpki-roots-no-provider", "stream", "json"], default-features = false }
reqwest13 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream"] }
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8", "pem"] }
sha2 = "0.10"
subtle = "2.6"
serde_jcs = "0.1"

rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rmcp = { path = "../rust-sdk-main/crates/rmcp", default-features = false, features = ["server", "client", "macros", "elicitation", "request-state", "skills-fs", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider", "transport-streamable-http-server"] }
litert-lm-rust = { version = "=0.2.4", default-features = false }

anyhow = "1.0"
async-compression = { version = "0.4.6", features = ["brotli", "gzip", "zstd", "deflate", "tokio"] }
base64 = "0.22.0"
bytes = "1.5"
clap = { version = "4.5.1", features = ["derive", "env"] }
cookie = "0.18.0"
dirs = "5.0.1"
fancy-regex = "0.14.0"
futures-util = "0.3.30"
http = "1.1.0"
http-body-util = "0.1"
hyper = { version = "1.0", features = ["full"] }
hyper-rustls = { version = "0.27.3", default-features = false, features = ["webpki-roots", "webpki-tokio", "ring", "http1", "http2", "tls12"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "service"] }
hyper-tungstenite = "0.17.0"
indexmap = { version = "2.2.5", features = ["serde"] }
moka = { version = "0.12.5", features = ["future"] }
pin-project-lite = "0.2.13"
rand = "0.8.5"
rcgen = { version = "0.13.0", default-features = false, features = ["x509-parser", "pem", "ring"] }
rsa = "0.9.6"
rustls-pemfile = "2.0.0"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114", features = ["preserve_order"] }
time = "0.3.34"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "io-util", "signal"]}
tokio-graceful = "0.2.2"
tokio-util = { version = "0.7",  features = ["io-util", "compat"] }
tokio-rustls = { version = "0.26.0", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-stream = { version = "0.1.14", default-features = false, features = ["sync"] }
tokio-tungstenite = { version = "0.26.1", features = ["rustls", "rustls-tls-webpki-roots"] }
url = "2.5.0"
crossterm = "0.28.1"
ratatui = { version = "0.29.0", features = ["unstable-rendered-line-info"] }
unicode-width = "0.2.0"
log = "0.4.22"
simplelog = "0.12.2"
shell-words = "1.1.0"
tui-input = "0.11.1"

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.3.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(not(any(target_os = "linux", target_os = "android", target_os = "emscripten")))'.dependencies]
arboard = { version = "3.3.0", default-features = false }

[dev-dependencies]
tempfile = "3"
async-compression = { version = "0.4.12", features = ["gzip", "tokio"] }
async-http-proxy = { version = "1.2.5", features = ["runtime-tokio"] }
insta = "1.36.1"
pretty_assertions = "1.4.0"
reqwest = { version = "0.12.2", features = ["rustls-tls-webpki-roots-no-provider", "stream", "json"], default-features = false }



[build-dependencies]
sha2 = "0.10"
serde_json = "1"
